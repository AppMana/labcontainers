[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labcontainers"
version = "0.2.0a2"
description = "Isolated network and VM integration-test labs powered by Containerlab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["grpcio>=1.66,<2", "protobuf>=4.25,<6", "pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/AppMana/labcontainers"
Issues = "https://github.com/AppMana/labcontainers/issues"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["labcontainers*"]

[tool.setuptools.package-data]
labcontainers = ["CONTAINERLAB-LICENSE", "CLOUD-INIT-LICENSE"]
