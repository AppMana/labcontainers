[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labcontainers"
version = "0.1.0a1"
description = "Isolated network and VM integration-test labs powered by Containerlab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["grpcio>=1.66,<2", "protobuf>=4.25,<6"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
