name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: go test ./...
      - run: go vet ./...
      - run: python -m pip install -e .
      - run: python -m unittest discover -s python/tests -v
      - uses: astral-sh/setup-uv@v6
      - run: make generate-containerlab
      - run: git diff --exit-code -- schemas/containerlab python/labcontainers/containerlab_generated.py python/labcontainers/CONTAINERLAB-LICENSE
      - run: python -m py_compile python/labcontainers/*.py images/*/launcher.py
      - run: npm ci
      - run: node -e "const {Client} = require('./'); if (!Client.launch) process.exit(1)"
      - run: npm pack --dry-run
